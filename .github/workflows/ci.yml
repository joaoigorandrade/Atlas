# CI — the Phase 0 gates. Each matrix entry is its own status check, so each can
# be required on main individually (see docs/PLAN-QUALITY.md §0.5) and a failure
# names the gate that failed rather than "ci".
#
#   lint          eslint — real-bug rules only, no style (Prettier owns style)
#   format:check  prettier
#   typecheck     tsc --noEmit
#   test:coverage vitest + the coverage floor on lib/** (vitest.config.ts)
#   size          scripts/size-budget.mjs — the ratchet on file length
#   build         next build
#   e2e           playwright — the app driven end to end in fixture mode
#                 (ATLAS_FIXTURES=1), so it costs no OpenRouter call
#
# Live-model evals (npm run eval) are intentionally NOT run here — they cost
# money and need a key.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format:check, typecheck, test:coverage, size, build]
    env:
      # Build-time placeholders — no real service is reached during CI.
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      # Fixture mode (docs/AGENT-TESTING.md): every generation is answered from
      # lib/server/fixtures.ts, so this job needs no OpenRouter key and no
      # Supabase project — the placeholders below are only there because the
      # browser client is still constructed.
      ATLAS_FIXTURES: "1"
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
